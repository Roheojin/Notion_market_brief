name: notion-market-brief

# 노션 마켓 브리핑 — 한국장 · 미국장 마감 종가 기준 차트 분석을 각각 노션에 게시

on:
  schedule:
    # 한국장: 평일 20:40 KST (= 11:40 UTC) — 15:30 종가 + 애프터마켓(~20:00) 뒤 확정 수급
    - cron: "40 11 * * 1-5"
    # 미국장: 화~토 06:20 KST (= 전일 21:20 UTC) — 미국장 마감 직후
    - cron: "20 21 * * 1-5"
  workflow_dispatch:      # Actions 탭의 "Run workflow" 버튼
    inputs:
      market:
        description: "시장 (kr=한국장, us=미국장, both=둘 다)"
        type: choice
        options: [both, kr, us]
        default: both
      force:
        description: "휴장일 체크 무시 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write   # history/ (지표 로그 · 환율 로그 · 수급 캐시) 커밋용

jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 차트 분석 생성 + 노션 게시
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKETS: ${{ github.event_name == 'schedule' && (github.event.schedule == '40 11 * * 1-5' && 'kr' || 'us') || (inputs.market == 'both' && 'kr us' || inputs.market) }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          for m in $MARKETS; do
            python main.py --session chart --market "$m" --post $FORCE
          done

      - name: 지표 로그 · 수급 캐시 커밋
        if: always()
        run: |
          if [ -d history ]; then
            git config user.name "market-brief-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history/
            git diff --cached --quiet || git commit -m "chore: 차트 분석 로그 갱신 [skip ci]"
            git push || true
          fi

      - name: 블로그 팩 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-pack
          path: output/
          retention-days: 7
