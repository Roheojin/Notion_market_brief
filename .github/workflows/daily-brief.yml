name: notion-market-brief

# 노션 마켓 브리핑 — 아침 차트 분석을 노션에 자동 게시 (인스타그램 없음)
# 위치: 저장소의 .github/workflows/daily-brief.yml  (setup_github.bat이 옮겨 줍니다)

on:
  schedule:
    # 아침 06:20 KST (= 전일 21:20 UTC): 미국장 마감 + 전일 코스피, 화~토
    - cron: "20 21 * * 1-5"
  workflow_dispatch:      # Actions 탭의 "Run workflow" 버튼
    inputs:
      force:
        description: "휴장일 체크 무시 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write   # history/ (지표 로그 · 환율 로그 · 수급 캐시) 커밋용

jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 차트 분석 생성 + 노션 게시
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --session chart --post ${{ inputs.force && '--force' || '' }}

      - name: 지표 로그 · 수급 캐시 커밋
        if: always()
        run: |
          if [ -d history ]; then
            git config user.name "market-brief-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history/
            git diff --cached --quiet || git commit -m "chore: 차트 분석 로그 갱신 [skip ci]"
            git push || true
          fi

      - name: 블로그 팩 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-pack
          path: output/
          retention-days: 7
