name: calendar-test

# 인베스팅닷컴 경제 캘린더 접속 시험 (임시 — 확인 후 삭제)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 시험
        run: |
          python -c "
          import datetime as dt
          from marketbrief import econcal
          today = dt.date.today()
          ev = econcal.fetch_events(today, today + dt.timedelta(days=7))
          print('events', len(ev))
          for e in ev[:20]: print(e)
          "
